name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMIO_VERSION: "6.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini', 'scripts/**') }}

      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Unit tests
        run: pio test -e native

      - name: Build (NodeMCU v2 with ILI9341)
        run: pio run -e nodemcuv2_ili9341

      - name: Build (NodeMCU v2 with ST7789)
        run: pio run -e nodemcuv2_st7789
