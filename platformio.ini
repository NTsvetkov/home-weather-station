; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2_ili9341

[common]
platform = espressif8266@4.0.1
board = nodemcuv2
framework = arduino
lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit AHTX0@2.0.6
	bblanchon/ArduinoJson@6.21.6
build_flags =
	-Wno-unused-const-variable
	-Wno-cpp
extra_scripts =
	pre:scripts/patch_font.py
	pre:scripts/patch_aht_timeout.py
monitor_speed = 115200

[env:nodemcuv2_st7789]
extends = common
lib_deps =
	${common.lib_deps}
	adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
build_flags =
	${common.build_flags}
	-DDISPLAY_ST7789

[env:nodemcuv2_ili9341]
extends = common
lib_deps =
	${common.lib_deps}
	adafruit/Adafruit ILI9341@1.6.4
build_flags =
	${common.build_flags}
	-DDISPLAY_ILI9341
